name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v (e.g. 1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag_name: ${{ steps.v.outputs.tag_name }}
    steps:
      - id: v
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VER="${DISPATCH_VERSION#v}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "tag_name=v${VER}" >> "$GITHUB_OUTPUT"
          else
            TAG="$REF_NAME"
            VER="${TAG#v}"
            echo "version=${VER}" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: prepare
    uses: SpaceFoon/RPG-Maker-MV-MZ-plugins/.github/workflows/release-plugin.yml@main
    with:
      plugin_slug: fugs-yep-galv-sprite-offset-fix
      plugin_name: Fugs YEP/Galv SpriteOffset Fix
      short_name: FugsYEP-GALV-SpriteOffsetFix
      version: ${{ needs.prepare.outputs.version }}
      tag_name: ${{ needs.prepare.outputs.tag_name }}
      files: |
        FugsYEP-GALV-SpriteOffsetFix.js
        LICENSE
        README.md
      install_notes: |
        Enable in Plugin Manager. Order may matter relative to YEP Sprite Offset and Galv Camera Control.
    secrets:
      FUGS_SITE_SYNC_TOKEN: ${{ secrets.FUGS_SITE_SYNC_TOKEN }}
